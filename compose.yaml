services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: QuanLyKhachSan
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hotel_demo_root}
      MYSQL_USER: ${MYSQL_USER:-hotel_demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_demo_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/QuanLyKhachSan.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/QuanLyKhachSan_data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/QuanLyKhachSan?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-hotel_demo}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-hotel_demo_password}
      SPRING_JPA_SHOW_SQL: "false"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
